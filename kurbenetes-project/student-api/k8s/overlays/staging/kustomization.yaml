apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

replicas:
  - name: student-api
    count: 2

configMapGenerator:
  - name: student-api-config
    literals:
      - APP_ENV=staging
      - APP_MESSAGE=Student API - Staging

generatorOptions:
  disableNameSuffixHash: true
images:
  - name: student-api
    newName: student-api
    newTag: "5.0"
