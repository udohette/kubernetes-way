apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod

resources:
  - ../../base

replicas:
  - name: student-api
    count: 2

configMapGenerator:
  - name: student-api-config
    literals:
      - APP_ENV=aws-eks-production
      - APP_MESSAGE=Student API running on Amazon EKS

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: student-api
    newName: 953744261122.dkr.ecr.us-east-2.amazonaws.com/student-api
    newTag: "6.1"

patches:
  - path: service-loadbalancer-patch.yaml
