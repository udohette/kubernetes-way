name: Student API CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        working-directory: kubernetes-project/student-api
        run: npm ci

      - name: Run tests
        working-directory: kubernetes-project/student-api
        run: npm test

      - name: Build Docker image
        working-directory: kubernetes-project/student-api
        run: docker build -t student-api:${{ github.sha }} .
